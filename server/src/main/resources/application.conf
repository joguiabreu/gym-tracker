ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [com.gymtracker.api.ApplicationKt.module]
    }
}

gymtracker {
    # "mock" or "live". Defaults to mock so dev is zero-config.
    mode = "mock"
    mode = ${?GYM_MODE}

    claude {
        model = "claude-sonnet-4-20250514"
        model = ${?CLAUDE_MODEL}

        apiKey = ""
        apiKey = ${?ANTHROPIC_API_KEY}
    }
}
